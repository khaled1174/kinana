[workspace]
members = ["crates/core", "crates/cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
walkdir = "2"
serde_json = "1"
yaml-rust2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
